name: invest-signal

x-backend-env: &backend-env
  PGHOST: db
  PGDATABASE: ${POSTGRES_DB:-investsignal}
  PGUSER: ${POSTGRES_USER:-investsignal}
  PGPASSWORD: ${POSTGRES_PASSWORD:-investsignal_demo}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BUDGET_USD: ${LLM_BUDGET_USD:-45}
  LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-3}

services:
  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-18473}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investsignal}
      POSTGRES_USER: ${POSTGRES_USER:-investsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investsignal_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=64MB"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
