name: invest-signal

services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-4173}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
