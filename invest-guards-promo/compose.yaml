name: invest-signal

x-backend-env: &backend-env
  PGHOST: db
  PGDATABASE: ${POSTGRES_DB:-investsignal}
  PGUSER: ${POSTGRES_USER:-investsignal}
  PGPASSWORD: ${POSTGRES_PASSWORD:-investsignal_demo}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_TRIAGE_MODEL: ${LLM_TRIAGE_MODEL:-GigaChat-3-Pro}
  LLM_SMART_MODEL: ${LLM_SMART_MODEL:-GigaChat-3-Pro}
  LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-EmbeddingsGigaR}
  LLM_BUDGET_USD: ${LLM_BUDGET_USD:-45}
  LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-3}
  LLM_PRICES_JSON: ${LLM_PRICES_JSON:-{}}
  EXTRA_CA_FILE: ${EXTRA_CA_FILE:-}
  PIPELINE_INTERVAL_SECONDS: ${PIPELINE_INTERVAL_SECONDS:-60}
  PIPELINE_BATCH: ${PIPELINE_BATCH:-20}
  FOCUS_API_KEY: ${FOCUS_API_KEY:-}
  FOCUS_INN_LIMIT: ${FOCUS_INN_LIMIT:-950}
  FOCUS_AUTO_CHECK: ${FOCUS_AUTO_CHECK:-1}
  UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
  SOURCE_KINDS: rss
  # The scheduler runs in the worker service, not a second time inside the API.
  PIPELINE_WORKER: "0"

x-backend-volumes: &backend-volumes
  - ./certs:/run/investsignal/certs:ro

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build: ./frontend
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-18473}:8080"
    depends_on:
      backend:
        condition: service_healthy
      # Only with the analytics profile; lets `up --wait` accept the one-shot init.
      umami-init:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build: ./backend
    image: invest-signal-backend:local
    init: true
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  worker:
    image: invest-signal-backend:local
    init: true
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from sqlalchemy import text; from app.database import make_engine;
          engine = make_engine(); connection = engine.connect();
          connection.execute(text('SELECT 1')); connection.close(); engine.dispose()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Dzen search pages are rendered in a headless browser; opt in with `docker compose --profile dzen up -d`.
  dzen:
    build:
      context: ./backend
      dockerfile: Dockerfile.dzen
    image: invest-signal-dzen:local
    init: true
    profiles: ["dzen"]
    environment:
      <<: *backend-env
      SOURCE_KINDS: dzen
      PIPELINE_PROCESS: "0"
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Product analytics (Umami) with its own database; opt in with `docker compose --profile analytics up -d`.
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    init: true
    profiles: ["analytics"]
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL:-postgresql://umami:${UMAMI_DB_PASSWORD:-umami_demo}@events-db:5432/umami}
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: "1"
    ports:
      # Dashboard; the tracker and /api/send are served to browsers through the frontend at /stats/.
      - "${UMAMI_BIND:-127.0.0.1}:${UMAMI_PORT:-18474}:3000"
    depends_on:
      events-db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/heartbeat || curl -fs http://127.0.0.1:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  events-db:
    image: postgres:17-alpine
    profiles: ["analytics"]
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami_demo}
    volumes:
      - events_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=32MB"]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: sets the admin password and creates the website with UMAMI_WEBSITE_ID.
  umami-init:
    image: invest-signal-backend:local
    profiles: ["analytics"]
    command: ["python", "-m", "app.umami"]
    environment:
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD:-}
      UMAMI_APP_SECRET: ${UMAMI_APP_SECRET:-}
      UMAMI_DOMAIN: ${UMAMI_DOMAIN:-localhost}
    depends_on:
      umami:
        condition: service_healthy
      backend:
        condition: service_started
    restart: "no"
    logging: *logging

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investsignal}
      POSTGRES_USER: ${POSTGRES_USER:-investsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investsignal_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=64MB"]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  events_data:
